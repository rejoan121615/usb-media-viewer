name: Build Portable Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    branches: [ build ]

jobs:
  build-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm exec electron-forge make --platform=darwin --arch=x64

      # Rename the artifact before uploading
      - name: Rename macOS Intel artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p renamed
          mv out/make/zip/darwin/x64/*.zip "renamed/Usb.Media.Viewer-MacOs-Intel-Series-${VERSION}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-portable
          path: renamed/*.zip

  build-macos-m1:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm exec electron-forge make --platform=darwin --arch=arm64

      # Rename the artifact before uploading
      - name: Rename macOS M1 artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p renamed
          mv out/make/zip/darwin/arm64/*.zip "renamed/Usb.Media.Viewer-MacOs-M-Series-${VERSION}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-m1-portable
          path: renamed/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm exec electron-forge make --platform=win32 --arch=x64

      # Rename the artifact before uploading (PowerShell for Windows)
      - name: Rename Windows artifact
        shell: pwsh
        run: |
          $VERSION = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path renamed
          $file = Get-ChildItem -Path "out/make/zip/win32/x64/*.zip" | Select-Object -First 1
          Move-Item $file.FullName "renamed/Usb.Media.Viewer-win32-x64-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: renamed/*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm exec electron-forge make --platform=linux --arch=x64

      # Rename the artifact before uploading
      - name: Rename Linux artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p renamed
          mv out/make/zip/linux/x64/*.zip "renamed/Usb.Media.Viewer-linux-x64-${VERSION}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: renamed/*.zip

  release:
    needs: [build-macos-intel, build-macos-m1, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-intel-portable
          path: artifacts/macos-intel

      - uses: actions/download-artifact@v4
        with:
          name: macos-m1-portable
          path: artifacts/macos-m1

      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: artifacts/linux

      - name: Get version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/macos-intel/**
            artifacts/macos-m1/**
            artifacts/windows/**
            artifacts/linux/**
