name: Build Portable Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'        # Trigger on version tags like v1.0.0
    branches: [ build ]

jobs:
  build-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm exec electron-forge make --platform=darwin --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-portable
          path: out/make/zip/darwin/x64/**

  build-macos-m1:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm exec electron-forge make --platform=darwin --arch=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-m1-portable
          path: out/make/zip/darwin/arm64/**

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm exec electron-forge make --platform=win32 --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: out/make/zip/win32/x64/**

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm exec electron-forge make --platform=linux --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: out/make/zip/linux/x64/**

  release:
    needs: [build-macos-intel, build-macos-m1, build-windows, build-linux]  # Runs only after ALL builds succeed
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create releases
    steps:
      - uses: actions/checkout@v4

      # Download all artifacts from previous jobs
      - uses: actions/download-artifact@v4
        with:
          name: macos-intel-portable
          path: artifacts/macos-intel

      - uses: actions/download-artifact@v4
        with:
          name: macos-m1-portable
          path: artifacts/macos-m1

      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: artifacts/linux

      # Get version from package.json
      - name: Get version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Create GitHub Release and upload all artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true   # Auto-generates changelog from commits
          files: |
            artifacts/macos-intel/**
            artifacts/macos-m1/**
            artifacts/windows/**
            artifacts/linux/**
